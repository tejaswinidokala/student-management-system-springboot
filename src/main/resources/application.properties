spring.application.name=demo

# Local development database configuration
# MySQL example:
# spring.datasource.url=jdbc:mysql://localhost:3306/demo_API_D_db
# spring.datasource.username=root
# spring.datasource.password=sayam

spring.datasource.url=jdbc:h2:mem:demo_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
server.port=56305

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

#(this command only store to single data)
#spring.jpa.hibernate.ddl-auto=create

#spring.jpa.hibernate.ddl-auto=update (this command to store multiples data)
spring.jpa.hibernate.ddl-auto=update

logging.file.name=app.log

spring.jpa.show-sql=true
spring.h2.console.enabled=true

